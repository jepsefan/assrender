name: Build assrender AAR

on:
  workflow_dispatch:
  push:
    paths:
      - 'assrender/**'
      - 'scripts/**'
      - '.github/workflows/build-aar.yml'

jobs:
  android-aar:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config             build-essential cmake ninja-build meson gettext autopoint             yasm nasm curl bzip2 xz-utils
      - name: Install Android NDK
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Build native libraries for both ABIs
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.2.12479018
        run: |
          bash scripts/build-libass.sh arm64
          bash scripts/build-libass.sh arm
      - name: Package required native libraries
        run: |
          for abi in arm64-v8a armeabi-v7a; do
            mkdir -p "assrender/src/main/jniLibs/$abi"
            for lib in ass freetype fribidi harfbuzz; do
              cp "prebuilt/$abi/lib/lib$lib.so" "assrender/src/main/jniLibs/$abi/"
            done
          done
      - name: Verify native dependencies
        run: |
          for abi in arm64-v8a armeabi-v7a; do
            for lib in ass freetype fribidi harfbuzz; do
              test -s "assrender/src/main/jniLibs/$abi/lib$lib.so" || exit 1
            done
          done
      - name: Assemble release AAR
        run: bash ./gradlew :assrender:assembleRelease --stacktrace
      - name: Inspect generated AAR
        run: |
          unzip -l assrender/build/outputs/aar/assrender-release.aar | tee aar-contents.txt
          for abi in arm64-v8a armeabi-v7a; do
            unzip -Z1 assrender/build/outputs/aar/assrender-release.aar | grep -q "jni/$abi/libassrender.so"
            unzip -Z1 assrender/build/outputs/aar/assrender-release.aar | grep -q "jni/$abi/libass.so"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: assrender-android-aar
          path: assrender/build/outputs/aar/*.aar
          if-no-files-found: error
